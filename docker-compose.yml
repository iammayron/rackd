# MyFit self-host (home box + Tailscale). See DEPLOY.md for the full flow.
#
# Supabase runs separately via the CLI on the box (`supabase start` — it manages
# its own containers). This compose runs the app services:
#   sync  — Triplit sync server (durable sqlite volume)
#   web   — Next.js PWA (standalone)
#   minio — S3-compatible object store for profile photos (durable volume)
#
# 1. cp .env.example .env  and fill every value (see DEPLOY.md)
# 2. docker compose up -d --build
# 3. expose over Tailscale; install the PWA on your phone
services:
  sync:
    build:
      context: .
      dockerfile: apps/sync/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # RS256 public JWK (single key) from Supabase JWKS — validates user tokens.
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET in .env}
      PORT: 8787
      STORAGE: sqlite
      LOCAL_DATABASE_URL: /data/triplit.db
      PROJECT_ID: myfit
    ports:
      - "8787:8787"
    volumes:
      - myfit-sync-data:/data
    healthcheck:
      # node:22-slim has no curl/wget; use Node's global fetch.
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:8787/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        NEXT_PUBLIC_TRIPLIT_URL: ${NEXT_PUBLIC_TRIPLIT_URL:?}
        # VAPID public key — baked into the client so the SW can subscribe to push.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:?set NEXT_PUBLIC_VAPID_PUBLIC_KEY in .env}
    restart: unless-stopped
    environment:
      # Server-side only (read at runtime by the upload route handler) — NOT baked
      # into the client bundle. The browser never sees the S3 secret.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL in .env}
      S3_BUCKET: ${S3_BUCKET:-myfit}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "3000:3000"
    depends_on:
      - sync
      - minio

  # Web Push sender — drains the scheduledPushes queue and delivers VAPID pushes
  # at each rest timer's endAt, so a backgrounded/locked phone still gets alerted.
  # Connects to the sync server with a service token (minted from JWT_SECRET).
  push:
    build:
      context: .
      dockerfile: apps/push/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TRIPLIT_URL: ${PUSH_TRIPLIT_URL:-http://sync:8787}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@rackd.app}
    depends_on:
      sync:
        condition: service_healthy

  # S3-compatible object store for profile photos. Console on :9001, API on :9000.
  # The bucket must allow anonymous downloads so <img> can load photos; create it
  # and set the policy once (see DEPLOY.md):
  #   mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   mc mb local/myfit && mc anonymous set download local/myfit
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - myfit-minio-data:/data

volumes:
  myfit-sync-data:
  myfit-minio-data:
