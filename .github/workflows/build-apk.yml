name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rackd-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd android && ./gradlew assembleRelease --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: rackd-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: rackd-wear-apk
          path: android/wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: error

      - name: Write Android version manifest
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          def read(path):
              text = pathlib.Path(path).read_text()
              code = int(re.search(r"versionCode\s+(\d+)", text).group(1))
              name = re.search(r'versionName\s+"([^"]+)"', text).group(1)
              return code, name
          wear_code, wear_name = read("android/wear/build.gradle")
          phone_code, phone_name = read("android/app/build.gradle")
          pathlib.Path("android-versions.json").write_text(json.dumps({
              "wearVersionCode": wear_code,
              "wearVersionName": wear_name,
              "phoneVersionCode": phone_code,
              "phoneVersionName": phone_name,
          }))
          PY

      # Each app offers an update only when its own versionCode is higher than the installed build.
      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android ${{ github.run_number }}
          files: |
            android-versions.json
            android/app/build/outputs/apk/release/app-release.apk
            android/wear/build/outputs/apk/release/wear-release.apk
          fail_on_unmatched_files: true
