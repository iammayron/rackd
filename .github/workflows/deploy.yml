name: Deploy to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Web app (rackd). NEXT_PUBLIC_* are inlined at build → passed as build args.
      - name: Deploy web
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Push sender (rackd-push). Separate app/image; secrets (DATABASE_URL +
      # VAPID_*) live on that app. Requires `fly apps create rackd-push` once.
      - name: Deploy push worker
        run: flyctl deploy --remote-only -c fly.push.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
