name: Deploy to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Apply schema changes to prod BEFORE deploying, so the schema the new
      # code expects exists before it serves traffic.
      #
      # We run drizzle-orm's migrator directly (`pnpm db:deploy` →
      # scripts/migrate.mjs), NOT a drizzle-kit CLI command:
      #   - `push` is interactive — in CI's no-TTY shell its prompt crashes
      #     (prints "undefined", exits 1).
      #   - `migrate` (CLI) builds its connection with sslmode=require, which pg
      #     now upgrades to verify-full; Supabase's cert chain isn't in Node's
      #     default CA bundle, so the handshake fails and the CLI also swallows
      #     it as "undefined". migrate.mjs owns the pool with relaxed TLS
      #     (mirroring db.ts) and only applies committed SQL migrations.
      #
      # BASELINE.sql runs first and is idempotent: it seeds drizzle's journal so
      # 0000_init + 0001 (originally applied via `push`, which records nothing in
      # the journal) are treated as already-applied, and back-fills activated_at
      # if missing. Without it, migrate would re-run 0000_init's CREATE TABLE
      # against the existing prod tables and fail. Safe to re-run every deploy.
      # Needs the DATABASE_URL repo secret (SESSION pooler URL, port 5432). A
      # failed run fails the job and blocks the deploy.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Apply DB schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/drizzle/BASELINE.sql
          pnpm --filter @rackd/db run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Web app (rackd). NEXT_PUBLIC_* are inlined at build → passed as build args.
      - name: Deploy web
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Push sender (rackd-push). Separate app/image; secrets (DATABASE_URL +
      # VAPID_*) live on that app. Requires `fly apps create rackd-push` once.
      - name: Deploy push worker
        run: flyctl deploy --remote-only -c fly.push.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
