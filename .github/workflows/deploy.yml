name: Deploy to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Apply schema changes to prod BEFORE deploying, so the schema the new
      # code expects exists before it serves traffic. Runs the same
      # `pnpm db:migrate` (drizzle-kit push) we use locally: it diffs schema.ts
      # against the live DB and applies the delta — no migrations journal to
      # baseline, so it can't fail on a fresh/empty journal. A failed run fails
      # the job and blocks the deploy. Needs the DATABASE_URL repo secret
      # (use the SESSION pooler URL, port 5432).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Apply DB schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Web app (rackd). NEXT_PUBLIC_* are inlined at build → passed as build args.
      - name: Deploy web
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Push sender (rackd-push). Separate app/image; secrets (DATABASE_URL +
      # VAPID_*) live on that app. Requires `fly apps create rackd-push` once.
      - name: Deploy push worker
        run: flyctl deploy --remote-only -c fly.push.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
