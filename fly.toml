# MyFit web — Fly.io configuration
# Deploy: fly deploy --remote-only
# Docs:   https://fly.io/docs/reference/configuration/

app = "rackd"
primary_region = "iad" # US East (Virginia) — change to match your Neon region

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
